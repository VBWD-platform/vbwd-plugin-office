name: Tests

# Public-repo security posture: no `pull_request_target`, no self-hosted
# runners, no secrets used by any job — a fork PR can never reach a credential.
on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: CI — office (lint + unit)
    runs-on: ubuntu-latest

    steps:
      - name: Clone vbwd-backend
        uses: actions/checkout@v4
        with:
          repository: VBWD-platform/vbwd-backend
          ref: main
          path: vbwd-backend

      # The on-disk dir MUST be the Python package name `office` — runtime
      # imports `plugins.office`.
      - name: Clone plugin
        uses: actions/checkout@v4
        with:
          path: vbwd-backend/plugins/office

      # No peer clones: PluginMetadata.dependencies is empty by design, and the
      # migration root is free-standing, so nothing else needs to be present.

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: vbwd-backend/requirements.txt

      - name: Install Python dependencies
        run: |
          pip install -r vbwd-backend/requirements.txt
          # The plugin's own runtime deps (openpyxl, for .xlsx import/export).
          pip install -r vbwd-backend/plugins/office/requirements.txt

      - name: Style check — Black
        run: black --check --diff vbwd-backend/plugins/office/ --exclude='/(\.git|__pycache__|\.pytest_cache)/'

      - name: Style check — Flake8
        run: flake8 vbwd-backend/plugins/office/ --max-line-length=120 --extend-ignore=E203,W503 --exclude=.git,__pycache__,.pytest_cache

      - name: Style check — Mypy
        run: mypy vbwd-backend/plugins/office/office/ --ignore-missing-imports --no-error-summary --python-version=3.11 || true

      # No database needed: the unit suite uses fakes, and the spreadsheet
      # engine is pure (its purity oracle proves office/sheet/ imports nothing
      # from vbwd, flask or sqlalchemy).
      - name: Run unit tests
        working-directory: vbwd-backend
        run: python -m pytest plugins/office/tests/unit/ -v --tb=short

  integration:
    name: Integration — office
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Clone vbwd-backend
        uses: actions/checkout@v4
        with:
          repository: VBWD-platform/vbwd-backend
          ref: main
          path: vbwd-backend

      - name: Clone plugin
        uses: actions/checkout@v4
        with:
          path: vbwd-backend/plugins/office

      # The manifest key MUST equal PluginMetadata.name, or the plugin never
      # enables while its blueprint still registers — 500s instead of 404s.
      - name: Create plugins.json (enable office)
        run: |
          echo '{"plugins":{"office":{"enabled":true,"version":"0.1.0","source":"local"}}}' \
            > vbwd-backend/plugins/plugins.json

      - name: Start services
        working-directory: vbwd-backend
        run: docker compose up -d --build

      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/api/v1/health > /dev/null 2>&1 && break
            sleep 2
          done
          curl -sf http://localhost:5000/api/v1/health || exit 1

      # The plugin owns a root Alembic revision; heads must apply from cold.
      - name: Apply migrations
        working-directory: vbwd-backend
        run: docker compose exec -T api alembic upgrade heads

      # Proves ENABLED, not merely mounted — a disabled plugin whose blueprint
      # registered without its DI providers would 500 here instead of answering.
      - name: Probe the capability route
        run: curl -sf http://localhost:5000/api/v1/office/meta

      - name: Run integration tests
        working-directory: vbwd-backend
        run: docker compose run --rm test pytest plugins/office/tests/integration/ -v --tb=short

      - name: Cleanup
        if: always()
        working-directory: vbwd-backend
        run: docker compose down -v
